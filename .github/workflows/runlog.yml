name: runlog
# Collects playtest runs into this repo's `runlog` branch every hour (and summary.json for runs.html) (runs/<player id>/<run id>.json). The game on
# this site posts each finished run (anonymous: a random player id, the moves, no personal data) to an ntfy.sh relay
# topic and to the developer's Google Form; the relay keeps messages ~12 h, so a pull every 6 h never misses one.
# It lives in this public repo because Actions minutes are free here (moved from the private tropebrawl repo, 2026-10-15).
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: 'Post a test run to the relay first'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: runlog
  cancel-in-progress: false
env:
  TOPIC: tropebrawl-runs-kiwp0utvtch4hz
  FORM_URL: https://docs.google.com/forms/d/e/1FAIpQLSf_eZB3usb1EU_m4smb5nb7aK3B7G5xwk8IYqp9CVZbTmSEyw/formResponse
  FORM_FIELD: entry.59978046
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: runlog
          path: data
      - name: Self-test (post a test run)
        if: ${{ inputs.selftest }}
        run: node src/runlog/selftest.mjs
      - name: Collect
        run: cd data && node ../src/runlog/collect.mjs
      - name: Summary for runs.html
        run: cd data && node ../src/runlog/summary.mjs
      - name: Commit
        run: |
          cd data
          git config user.name "runlog collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; else git commit -q -m "runlog: $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin HEAD:runlog; fi
  # The real-player board pool (TRO-401, async PvP part 1, built dark: the game doesn't read it yet). Verified runs only,
  # calibrated per board, consented boards only -> pool.json + pool-status.json on the runlog branch. Code: runlog/sim/
  # (copied from the dev repo by its runlog/sync-play.sh). Older builds come from this repo's index.html history.
  pool:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: runlog
          path: data
      - uses: actions/cache@v4
        with:
          path: builds
          key: pool-builds-${{ github.run_id }}
          restore-keys: pool-builds-
      - name: Board pool
        run: cd data && node ../src/runlog/sim/runlog/pool.mjs --build ../src/index.html --gitrepo ../src --gitfile index.html --scan --builds ../builds --workers 4 --max 1500
      - name: Commit
        run: |
          cd data
          git config user.name "runlog collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pool.json pool-status.json pool/cache.json
          if git diff --cached --quiet; then echo "nothing new"; else git commit -q -m "pool: $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin HEAD:runlog; fi
