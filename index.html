<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Tropebrawl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one centered column (max 760px) that fits a phone screen without reading: top bar, next fight,
   board + bench, synergy icons, shop, action bar. Details live in tap-to-open sheets. Battle = enemy rows
   above the clash line, yours below. Single dark look by design: every color is a token on :root. */
:root{
  /* Night Ink: flat charcoal page, ink-black panels with hard square shadows, one punchy yellow. The board is a grid of
     crisp square tiles with black outlines, so every position reads at a glance. */
  --bg:#1e1d21; --bg2:#26252a; --panel:#121114; --panel2:#2d2c32; --line:#3d3b43;
  --ink:#f3eee4; --muted:#aaa49b; --dim:#6d6962;
  --gold:#ffcc2e; --gold-dk:#a37800; --red:#ff4d3d; --ground:#2f2924; --ground2:#3a322b; --inkline:#000; --good:#6cc47a; --mana:#5d95e6; --shield:#d9e1ec; --leg:#ff9f43;
  --dud:#3a3340;
  --r1:#b4adbf; --r2:#62d98b; --r3:#5aa9ff; --r4:#b98cff; --r5:#ff6b9d;
  --g-army:#a3b462; --g-orc:#de6f47; --g-elf:#5fcab8; --g-fin:#e9c352; --g-grim:#d84d60; --g-bug:#ab80ea; --g-ball:#4fa3f7; --g-undead:#8fd18a; --g-heist:#e9c352; --g-west:#e0874f; --foe:#c45a4e;
  --f-display:"Anton","Impact","Arial Narrow Bold",sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 40px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
h2{font-size:1.3rem}
p{margin:0}
button{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:.55em 1em;border-radius:10px;cursor:pointer;font-weight:800;line-height:1.1}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1408}
.btn.big{font-family:var(--f-display);font-weight:400;font-size:1.25rem;padding:.6em 1.3em}
.btn.sm{font-size:.82rem;padding:.4em .7em}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.screen{display:grid;gap:12px}
.eyebrow{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
.muted{color:var(--muted)}
.emo{font-family:var(--f-emoji);line-height:1}
.goldv{color:var(--gold)}

/* genre + tier color hooks */
.g-army{--gc:var(--g-army)}.g-orc{--gc:var(--g-orc)}.g-elf{--gc:var(--g-elf)}.g-fin{--gc:var(--g-fin)}.g-grim{--gc:var(--g-grim)}.g-bug{--gc:var(--g-bug)}.g-ball{--gc:var(--g-ball)}.g-undead{--gc:var(--g-undead)}.g-heist{--gc:var(--g-heist)}.g-west{--gc:var(--g-west)}.g-foe{--gc:var(--foe)}
.tier1{--tc:var(--r1)}.tier2{--tc:var(--r2)}.tier3{--tc:var(--r3)}.tier4{--tc:var(--r4)}.tier5{--tc:var(--r5)}

/* top bar */
.top{display:grid;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.top .r1{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.res{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.res span{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.res small{font-family:var(--f-body);font-size:.72rem;color:var(--good);font-weight:800}
.strip{display:flex;column-gap:7px;row-gap:4px;align-items:center;flex-wrap:wrap}
.strip .act{display:flex;gap:3px;padding:2px;border-radius:3px}
.strip .act.cur{background:color-mix(in srgb,var(--gold) 16%,transparent)}
.strip i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--panel);font-size:.7rem;opacity:.45;font-family:var(--f-emoji)}
.strip i.done{opacity:.22}
.strip.long .act{gap:2px}
.strip.long i{width:15px;font-size:.62rem}
.strip i.now{opacity:1;background:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.strip i.bossp{background:color-mix(in srgb,var(--red) 30%,var(--panel))}
.items{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ic{appearance:none;cursor:pointer;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:inline-grid;place-items:center;font-size:1.05rem;padding:0;font-family:var(--f-emoji)}
.ic.rare{border-color:var(--r3)}
.ic{position:relative}
.ipip{position:absolute;left:0;right:0;bottom:-6px;font:800 8px/1 var(--f-body);font-style:normal;color:var(--gold);letter-spacing:-1px;text-align:center;text-shadow:0 0 3px var(--bg),0 0 2px var(--bg)}
.ic.leg{border-color:var(--leg);box-shadow:0 0 0 1px var(--leg),0 0 12px color-mix(in srgb,var(--leg) 45%,transparent)}

/* portrait */
.pt{position:relative;flex:none;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--gc);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gc) 35%,var(--panel)),var(--bg2) 75%);font-family:var(--f-emoji);font-size:1.4rem;line-height:1}
.pt svg{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;padding:2px;border-radius:50%;background:var(--bg);border:1px solid var(--gc);stroke:var(--gc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pt.sm{width:32px;height:32px;font-size:1rem}
.pt.sm svg{width:14px;height:14px;right:-4px;bottom:-4px;padding:1px}
.pt.lg{width:64px;height:64px;font-size:2.1rem}
.stars{color:var(--gold);font-size:.78rem;letter-spacing:-.04em;line-height:1}
.crowdn{font-family:var(--f-display);font-size:.66rem;color:#141018;background:var(--gc);border-radius:4px;padding:0 4px;line-height:1.4}

/* next fight */
.vs{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.vs.boss{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--bg2))}
.vs .tag{font-family:var(--f-display);font-size:.8rem;color:var(--muted)}
.vs.boss .tag{color:var(--red)}
.foes{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.foe{appearance:none;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:2px;border:none;background:none;min-width:44px}
.foe small{font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.foe .ab{font-family:var(--f-emoji);font-size:.62rem;line-height:1}

/* board */
.board{display:grid;gap:6px;padding:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px}
.frow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.frow.bench{grid-template-columns:repeat(5,minmax(0,1fr));padding-top:6px;border-top:1px dashed var(--line)}
/* Buyback Wheel: characters that sell back at full price get a running gold border */
@property --fsa{syntax:'<angle>';inherits:false;initial-value:0deg}
.slot.fullsell{border-color:transparent;background:linear-gradient(var(--panel),var(--panel)) padding-box,conic-gradient(from var(--fsa),var(--gold),#fff6d6,var(--gold-dk),var(--gold),#fff6d6,var(--gold-dk),var(--gold)) border-box;border:3px solid transparent;box-shadow:0 0 14px color-mix(in srgb,var(--gold) 45%,transparent),inset 0 0 10px color-mix(in srgb,var(--gold) 18%,transparent);animation:fsspin 3s linear infinite}
.slot.fullsell::after{content:'🎡';position:absolute;top:3px;left:4px;font-size:.62rem;font-family:var(--f-emoji)}
@keyframes fsspin{to{--fsa:360deg}}
@media (prefers-reduced-motion:reduce){.slot.fullsell{animation:none}}
.slot{appearance:none;cursor:pointer;position:relative;min-height:88px;min-width:0;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:10px 3px 6px;text-align:center}
.slot.empty{border-style:dashed;background:transparent;color:var(--dim);font-size:1rem}
.slot:not(.empty){border-color:color-mix(in srgb,var(--gc) 50%,var(--line))}
.slot.sel{box-shadow:0 0 0 2px var(--gold);border-color:var(--gold)}
.slot.target{border-color:var(--gold-dk)}
.slot .nm{font-weight:800;font-size:.72rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench .slot{min-height:70px}
.bench .slot .pt{width:34px;height:34px;font-size:1.1rem}
.bench .slot .pt svg{display:none}
.bench .slot .nm{display:none}
.rowlbl{display:flex;justify-content:space-between;align-items:baseline;font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:800;padding:0 2px}
.rowlbl b{color:var(--muted);letter-spacing:.04em;font-size:.72rem}
/* layout: wide screens = character info (left) | game | your items (right); phones = info under the board, items in the top bar */
.layout{display:grid;gap:12px}
.insp{display:grid;gap:10px;align-content:start;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px}
.insp .x{justify-self:end;margin-top:-4px}
.insp h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.ilist{display:grid;gap:6px}
.irow{appearance:none;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.82rem;color:var(--muted)}
.irow b{display:block;color:var(--ink);font-size:.86rem}
.irow .emo{font-size:1.3rem}
.irow.leg{border-color:var(--leg)}
.irow.rare{border-color:var(--r3)}
.irow.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.istars{color:var(--gold);font-size:.78em;letter-spacing:-1px;white-space:nowrap}
strong.lvon{color:var(--gold);font-weight:800}
.irules{margin:0;padding-left:16px;font-size:.76rem;color:var(--muted);display:grid;gap:3px}
.targ{font-size:.82rem;color:var(--muted);border-left:3px solid var(--gold-dk);padding-left:8px}
@media (min-width:1000px){
  #app{max-width:1420px}
  .layout{grid-template-columns:minmax(240px,300px) minmax(430px,1fr) minmax(220px,270px);align-items:start}
  .insp{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));max-height:calc(100vh - 24px);overflow:auto}
  .layout .top .items{display:none}
}
.itemcount{font-family:var(--f-body);font-weight:800;color:var(--dim)}
.goldpill{font-family:var(--f-display);font-size:1.05rem;color:var(--gold);white-space:nowrap;padding:0 2px}
.shopitems{margin:2px 0 6px}
@media (min-width:1000px){.shopitems{display:none}}
/* end-of-run stats: KPI tiles, one emphasis bar chart (damage), one stacked bar (gold), a round strip */
:root{--s-char:#3987e5;--s-roll:#d95926;--s-rank:#199e70}
.endwrap{display:grid;gap:14px;padding-block:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;align-content:start}
.kpi>span{font-size:.75rem;color:var(--muted);font-weight:700}
.kpi b{font-family:var(--f-display);font-weight:400;font-size:1.55rem;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.kpi small{font-size:.72rem;color:var(--dim)}
.endgrid{display:grid;gap:12px}
@media (min-width:1000px){.endgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.endcard{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;align-content:start}
.endcard h3{font-size:.85rem;color:var(--muted);letter-spacing:.04em}
.endchip,.endrow{cursor:pointer}
.endcard .sub{font-size:.78rem;color:var(--dim)}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:.82rem;cursor:default;border-radius:6px;padding:2px 0}
.bar:hover,.bar:focus-visible{background:var(--panel)}
.bar .who{display:flex;align-items:center;gap:6px;min-width:0;color:var(--ink)}
.bar .who em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:12px}
.bar .fill{height:100%;border-radius:0 4px 4px 0;background:var(--dim);min-width:2px}
.bar.mvp .fill{background:var(--gold)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700}
.spend{display:flex;height:16px;gap:2px}
.spend i{display:block;height:100%;min-width:3px}
.spend i:first-child{border-radius:4px 0 0 4px}.spend i:last-child{border-radius:0 4px 4px 0}.spend i:only-child{border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.rstrip{display:flex;flex-wrap:wrap;gap:4px}
.rstrip span{display:grid;place-items:center;gap:1px;min-width:36px;padding:4px 3px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:.66rem;color:var(--muted);cursor:default}
.rstrip span b{font-size:.85rem;font-family:var(--f-emoji)}
.rstrip .w{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}.rstrip .w i{color:var(--good)}
.rstrip .l{border-color:color-mix(in srgb,var(--red) 55%,var(--line))}.rstrip .l i{color:var(--red)}
.rstrip i{font-style:normal;font-weight:800}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chiprow>span{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 3px;font-size:.8rem}
#vtip{position:fixed;z-index:70;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:.78rem;color:var(--ink);max-width:240px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
@media (max-width:480px){.bar{grid-template-columns:minmax(0,134px) minmax(0,1fr) 44px;font-size:.78rem}}
/* codex */
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.ccard{display:grid;gap:6px;align-content:start;text-align:left;font:inherit;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.84rem;color:var(--muted)}
.ccard .hd{display:flex;gap:10px;align-items:center;color:var(--ink)}
.ccard .hd b{display:block;font-size:.95rem}
.ccard p b{color:var(--ink)}
.codex h3{font-size:1rem;margin-top:6px}
.rules{display:grid;gap:8px;max-width:70ch}
.rules p{font-size:.92rem;color:var(--muted)}
.rules b{color:var(--ink)}

/* synergies */
.syns{display:flex;flex-wrap:wrap;gap:6px}
.syn{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:.25em .6em .25em .4em;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:.8rem;font-weight:800;color:var(--muted)}
.syn .e{font-family:var(--f-emoji);font-size:.95rem;line-height:1}
.syn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.syn .c{font-variant-numeric:tabular-nums}
.syn.on{color:#141018;background:var(--gc,var(--gold));border-color:var(--gc,var(--gold))}
.syn.combo{background:var(--gold);border-color:var(--gold);color:#141018}

/* shop */
.shopwrap{display:grid;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px}
.shop{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scard{appearance:none;cursor:pointer;position:relative;display:grid;gap:4px;justify-items:center;text-align:center;padding:10px 3px 7px;border-radius:12px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--tc);min-width:0;width:100%}
.scard:hover:not(:disabled){border-color:var(--gold)}
.scard.tier5{box-shadow:0 0 14px color-mix(in srgb,var(--r5) 45%,transparent)}
.scard.fresh{animation:fresh 1.2s ease-out 2}
@keyframes fresh{50%{box-shadow:0 0 0 2px var(--tc),0 0 20px var(--tc)}}
@media (prefers-reduced-motion:reduce){.scard.fresh{animation:none}}
.scard:disabled{cursor:not-allowed}
.scard:disabled>*:not(.why){opacity:.45}
.scard .why{font-size:.6rem;font-weight:800;color:var(--red);line-height:1.1}
.slot .tagl{position:absolute;top:3px;left:4px;font-size:.55rem;font-weight:800;letter-spacing:.06em;border-radius:3px;padding:0 3px;line-height:1.5}
.slot.tier3,.slot.tier4,.slot.tier5{border-top:3px solid var(--tc)}
.slot .tagl.max{background:var(--gold);color:#1a1408}
.slot .tagl.spare{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.scard.sold{border-style:dashed;border-top-width:1px;cursor:default;min-height:124px;opacity:.3}
.scard .nm{font-weight:800;font-size:.7rem;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scard .tags{display:flex;gap:3px;align-items:center;justify-content:center;font-family:var(--f-emoji);font-size:.8rem}
.scard .x2s{font-family:var(--f-body);font-size:.62rem;font-weight:800;color:var(--tc);margin-left:-2px}
.scard .tags svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.scard .pr{font-family:var(--f-display);color:var(--gold);font-size:.9rem;line-height:1}
.scard.ready{box-shadow:0 0 0 2px var(--gold),0 0 18px color-mix(in srgb,var(--gold) 45%,transparent)}
.scard .own{position:absolute;top:3px;right:5px;font-size:.6rem;font-weight:800;color:var(--gold)}
.scard .lv2{position:absolute;top:3px;left:4px;font-size:.58rem;font-weight:800;background:var(--gold);color:#1a1408;border-radius:3px;padding:0 3px}
.scard .newr{position:absolute;top:3px;left:4px;font-size:.55rem;font-weight:800;background:var(--tc);color:#120f18;border-radius:3px;padding:0 3px}
.info{position:absolute;bottom:4px;right:4px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:.7rem;font-weight:800;display:grid;place-items:center;cursor:pointer;padding:0}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.oddsrow{appearance:none;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0 2px;cursor:pointer;color:var(--muted);font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;width:100%}
.odds{flex:1;display:flex;gap:2px;height:6px;border-radius:3px;overflow:hidden}
.odds i{display:block;height:100%;background:var(--tc)}
.rankbtn{display:inline-flex;align-items:center;gap:4px;padding-block:.2em;padding-inline:.25em .6em}
.gauge{--p:0;--q:0;--seg:90deg;position:relative;flex:none;display:grid;place-items:center;width:27px;height:27px;border-radius:50%;
  background:conic-gradient(var(--tc) calc(var(--p)*1%),transparent 0),
    repeating-conic-gradient(from calc(var(--p)*3.6deg),var(--panel2) 0 7deg,transparent 7deg var(--seg)),
    conic-gradient(color-mix(in srgb,var(--tc) 40%,transparent) calc(var(--q)*1%),var(--line) 0)}
.gauge::before{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--panel2)}
.gauge b{position:relative;font-family:var(--f-emoji);font-weight:400;font-size:.7rem;line-height:1}
.gauge.max{--tc:var(--gold);--p:100;--q:100;background:var(--gold)}
.rankbtn:disabled{opacity:1}.rankbtn:disabled .lbl{opacity:.4}
.gauge.pop{animation:gpop .35s ease-out}
@keyframes gpop{40%{transform:scale(1.18);box-shadow:0 0 12px var(--tc)}}
.rdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--tc);vertical-align:middle;margin-inline:3px 1px}
.chip.rar{color:var(--tc);border-color:var(--tc)}
.oddtbl{border-collapse:collapse;font-size:.8rem;font-variant-numeric:tabular-nums}
.oddtbl{width:100%}
.oddtbl th,.oddtbl td{padding:3px 4px;text-align:right;border-bottom:1px solid var(--line)}
.oddtbl th{color:var(--tc,var(--muted));font-weight:800}
.oddtbl tr.on td{color:var(--gold)}
.actions .grow{flex:1}

/* sheets */
.hs-head{display:flex;gap:12px;align-items:center}
.hs-name{font-family:var(--f-display);font-size:1.15rem;line-height:1.05}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:800;padding:.18em .55em;border-radius:999px;background:var(--bg2);color:var(--muted);border:1px solid var(--line)}
.chip.gen{color:var(--gc);border-color:color-mix(in srgb,var(--gc) 50%,var(--line))}
.chip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.statrow{display:flex;gap:16px;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.statrow b{display:block;color:var(--ink);font-size:1rem}
.skill{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.88rem}
.skill b{color:var(--mana)}
.flav{font-size:.8rem;color:var(--muted);font-style:italic}

/* battle */
.bhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:8px}
.speed{display:flex;gap:4px;flex-wrap:wrap}
.field{display:grid;gap:6px;padding:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;position:relative}
.field.shake{animation:shake .22s}
@keyframes shake{25%{transform:translate(3px,-2px)}50%{transform:translate(-3px,2px)}75%{transform:translate(2px,1px)}}
.clashline{height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);margin:4px 0}
.bslot{position:relative;min-height:96px;border:1px dashed color-mix(in srgb,var(--line) 70%,transparent);border-radius:12px;min-width:0}
.unit{position:absolute;inset:0;border-radius:12px;background:var(--panel);border:1px solid color-mix(in srgb,var(--gc) 55%,var(--line));padding:6px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:opacity .45s,filter .45s}
.unit.foe{background:color-mix(in srgb,var(--foe) 10%,var(--panel))}
.unit .pt{width:40px;height:40px;font-size:1.3rem}
.unit .meta{display:flex;gap:4px;align-items:center;min-height:12px}
.hpb{position:relative;width:100%;height:11px;border-radius:3px;background:var(--bg);border:1px solid var(--line);overflow:hidden;margin-top:auto}
.hpb .hf{position:absolute;inset:0 auto 0 0;background:var(--good)}
.unit.foe .hpb .hf{background:var(--red)}
.hpb .sf{position:absolute;inset:0 auto 0 0;background:var(--shield);opacity:.7}
.mpb{width:100%;height:4px;border-radius:2px;background:var(--bg);overflow:hidden}
.mpb i{display:block;height:100%;background:var(--mana)}
.sts{position:absolute;top:4px;right:5px;font-family:var(--f-emoji);font-size:.75rem;line-height:1}
.unit.hidden{opacity:.4}
.unit.dead{opacity:.12;filter:grayscale(1)}
.unit.casting{box-shadow:0 0 0 2px var(--mana),0 0 16px color-mix(in srgb,var(--mana) 55%,transparent)}
.unit.hit{animation:hit .25s}
@keyframes hit{40%{background:color-mix(in srgb,var(--red) 55%,var(--panel));box-shadow:0 0 0 2px var(--red);transform:translateX(3px)}}
.unit.atk{animation:atk .3s ease-out}
.unit.enter{animation:enter .45s ease-out}
@keyframes enter{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}
#bbench{font-size:.8rem;color:var(--muted);text-align:center;margin:4px 0 0}
@keyframes atk{40%{filter:brightness(1.45) drop-shadow(0 0 8px var(--gold))}}
/* hold to view, drag to buy or move */
.scard,.slot:not(.empty){-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:none}
.dragghost{position:fixed;z-index:60;pointer-events:none;opacity:.85;transform:translate(-50%,-50%) scale(.9);width:90px}
.slot.dropok{outline:2px dashed var(--gold);outline-offset:-3px}
.holdhint{font-size:.72rem;color:var(--muted);text-align:center;margin:2px 0 0}
.flt{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:.95rem;pointer-events:none;white-space:nowrap;text-shadow:0 2px 0 var(--bg),0 0 5px var(--bg);animation:rise .9s ease-out forwards;z-index:3}
.flt.crit{color:var(--gold);font-size:1.3rem}.flt.heal{color:var(--good)}.flt.sp{color:var(--mana);font-size:.75rem}.flt.shd{color:var(--shield);font-size:.8rem}.flt.miss{color:var(--muted);font-size:.75rem}.flt.ko{color:var(--red);font-size:1.25rem}
@keyframes rise{0%{opacity:0;translate:0 6px}15%{opacity:1}100%{opacity:0;translate:0 -32px}}
.aim{position:absolute;height:2px;transform-origin:0 50%;pointer-events:none;z-index:3;border-radius:2px;animation:aimf .42s ease-out forwards}
.aim.mine{background:linear-gradient(90deg,transparent,var(--gold))}
.aim.theirs{background:linear-gradient(90deg,transparent,var(--red))}
@keyframes aimf{0%{opacity:.9}100%{opacity:0}}
#hovcard{position:fixed;z-index:70;width:min(320px,calc(100vw - 16px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 8px 28px rgba(0,0,0,.45);pointer-events:none;font-size:.88rem}
.shopwrap.sellzone{outline:2px dashed var(--red);outline-offset:2px;position:relative}
.shopwrap.sellzone::after{content:attr(data-sell);position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);color:var(--red);font-family:var(--f-display);font-size:1.3rem;border-radius:14px;pointer-events:none}
.evstage{background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--gold) 14%,var(--bg2)),var(--bg));border:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));border-radius:18px;padding:22px 16px;max-width:640px;margin-inline:auto;text-align:center}
.evart{font-size:64px;line-height:1;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.evtitle{font-family:var(--f-display);margin:10px 0 4px;font-size:1.6rem}
.evflav{font-style:italic;color:var(--muted);margin:0 auto 14px;max-width:46ch}
.evbody{display:grid;gap:8px;text-align:left}
.wheelbox{position:relative;width:190px;height:190px;margin:4px auto 14px}
.wptr{position:absolute;left:50%;top:-14px;transform:translateX(-50%);color:var(--gold);font-style:normal;font-size:1.3rem;z-index:2;text-shadow:0 2px 4px #000}
.wheel{width:100%;height:100%;border-radius:50%;border:4px solid var(--gold);position:relative;transform:rotate(var(--rot));animation:wspin 2.2s cubic-bezier(.15,.85,.25,1) both;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.wheel span.dud{color:var(--muted);text-shadow:none}
.wheel span.jack{font-size:.62rem;color:#1a1408;text-shadow:none}
.wheel span{position:absolute;left:50%;top:50%;width:84px;margin:-.6em 0 0 -42px;text-align:center;font-weight:800;font-size:.78rem;color:#fff;text-shadow:0 1px 2px #000}
@keyframes wspin{from{transform:rotate(0deg)}to{transform:rotate(var(--rot))}}
.evresult.late{animation:evlate .4s 2.1s both}
@keyframes evlate{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.evduo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.evcard{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:16px 10px;font:inherit;cursor:pointer;min-height:190px}
.evcard:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.evcard:disabled{opacity:.45;cursor:not-allowed}
.evcard .big{font-size:2.2rem;line-height:1}
.evcard b{color:var(--gold);font-family:var(--f-display);font-size:1.02rem;letter-spacing:.02em}
.evcard small{color:var(--muted);font-size:.8rem;line-height:1.35}
.evcard .cost{color:var(--ink);font-weight:800;font-size:.85rem}
.evgenres{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.evback{margin-top:12px}
.evopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:11px 13px;font:inherit;font-size:.92rem;cursor:pointer}
.evopt:hover:not(:disabled){border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,var(--panel))}
.evopt:disabled{opacity:.45;cursor:not-allowed}
.evopt b{color:var(--gold);font-weight:800}
.evgroup{display:grid;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px;background:color-mix(in srgb,var(--bg) 40%,transparent)}
.evgh{font-size:.95rem}
.evnote{font-size:.85rem;color:var(--muted);text-align:center;margin:0}
.evresult{font-size:1rem;text-align:center;margin:6px 0 10px}
.scard .aimg{font-style:normal;font-size:.7rem;margin-right:1px}
.proj{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--gc);box-shadow:0 0 10px var(--gc);pointer-events:none;z-index:4}
.proj.ballp{width:auto;height:auto;background:none;box-shadow:none;font-family:var(--f-emoji);left:-10px;top:-10px;line-height:1}
.streak{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:.9rem;color:var(--leg);padding:.15em .6em;border:1px solid var(--leg);border-radius:999px}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.clock.ot{color:var(--red);font-weight:800}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 72%,transparent);border-radius:14px;z-index:6;padding:12px}
.ov{background:var(--panel);border:1px solid var(--gold-dk);border-radius:14px;padding:18px 20px;display:grid;gap:10px;justify-items:center;text-align:center;max-width:340px;width:100%}
.ov h2{font-size:2.2rem;color:var(--gold)}
.ov.lose h2{color:var(--red)}
.ov .rw{display:flex;gap:14px;justify-content:center;font-family:var(--f-display);font-size:1.05rem;flex-wrap:wrap}
.ov .why{display:flex;gap:10px;align-items:center;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.86rem;width:100%}
.ov .tip{font-size:.88rem;text-align:left;background:color-mix(in srgb,var(--gold) 12%,var(--bg2));border:1px solid var(--gold-dk);border-radius:10px;padding:8px 10px;width:100%}

/* choices, title */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.choice{appearance:none;cursor:pointer;text-align:center;display:grid;gap:6px;justify-items:center;align-content:start;padding:14px 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.choice:hover:not(:disabled){border-color:var(--gold)}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice .big{font-family:var(--f-emoji);font-size:2rem;line-height:1}
.choice b{font-size:.95rem}
.choice span{font-size:.8rem;color:var(--muted)}
.choice.rare{border-color:var(--r3)}
.choice.up{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--panel))}
.choice.legend{border-color:var(--leg);background:color-mix(in srgb,var(--leg) 8%,var(--panel))}
.choice .rar{font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--r3)}
.choice.legend .rar{color:var(--leg)}
.choice.up .rar{color:var(--gold)}
.choice.new:not(.rare) .rar{color:var(--muted)}
.title-word{font-family:var(--f-display);font-size:clamp(3rem,13vw,5.4rem);line-height:.9;color:var(--gold)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.steps div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;display:grid;gap:4px;font-size:.8rem;color:var(--muted)}
.steps .emo{font-size:1.6rem}
.steps b{color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:.95rem}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
/* game levels (difficulty ladder) */
.lvpick{display:grid;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;max-width:520px}
.lvh{font-family:var(--f-display);font-weight:400;color:var(--leg)}
.lvnums{display:flex;flex-wrap:wrap;gap:5px}
.lvn{appearance:none;cursor:pointer;min-width:36px;height:36px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:var(--f-display);font-size:.9rem}
.lvn.on{border-color:var(--leg);background:color-mix(in srgb,var(--leg) 22%,var(--panel));color:var(--leg)}
.lvn.won{box-shadow:inset 0 -3px 0 var(--gold)}
.lvn:disabled{opacity:.45;cursor:not-allowed;font-family:var(--f-emoji);font-size:.75rem}
.lvnew{font-size:.88rem}
.lvdial{font-size:.8rem;color:var(--muted)}
.lvold{font-size:.8rem;color:var(--muted)}
.lvold summary{cursor:pointer}
.lvold ul,.lvlist{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:.84rem}
.lvb{appearance:none;cursor:pointer;border:1px solid var(--leg);background:color-mix(in srgb,var(--leg) 12%,var(--panel));color:var(--leg);border-radius:8px;padding:1px 8px;font-family:var(--f-display);font-size:.9rem;line-height:1.5}
.lvwin{font-size:.92rem;background:color-mix(in srgb,var(--leg) 12%,var(--bg2));border:1px solid var(--leg);border-radius:10px;padding:8px 12px}
.gchips span{font-size:.8rem;font-weight:800;color:var(--gc);border:1px solid color-mix(in srgb,var(--gc) 45%,var(--line));padding:.2em .7em;border-radius:999px}

/* sheet + toast */
#scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 60%,transparent)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
#sheet .sh{width:min(620px,100%);background:var(--panel);border:1px solid var(--gold-dk);border-radius:14px;padding:16px;display:grid;gap:10px;max-height:82vh;overflow:auto;box-shadow:0 -12px 40px #0009}
.tl{font-size:.88rem;color:var(--muted)}
.tl.on{color:var(--ink)}
.tl b{color:var(--gold)}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--gold-dk);padding:8px 14px;border-radius:10px;font-weight:800;font-size:.9rem;max-width:calc(100% - 32px)}
@media (max-width:480px){
  .slot{min-height:82px}
  .pt{width:40px;height:40px;font-size:1.25rem}
  .unit .pt{width:34px;height:34px;font-size:1.1rem}
  .unit .pt svg{display:none}
  .scard .nm{font-size:.64rem}
  .scard .pr{justify-self:start;margin-left:5px}
  .scard .pt{width:36px;height:36px;font-size:1.15rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* test panel */
#dev{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;font-size:.85rem}
#dev.open{left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;justify-content:flex-end;pointer-events:none}
.dvfab{font:inherit;font-weight:800;background:#1d2a1f;color:#b9f2c4;border:1px dashed #6cc47a;border-radius:8px;padding:.5em .8em;cursor:pointer}
.dvpanel{pointer-events:auto;width:min(420px,100%);max-height:100%;overflow:auto;background:#141a15;color:#e3f3e6;border:1px dashed #6cc47a;border-radius:10px;padding:12px;display:grid;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.6);font-family:ui-monospace,"Courier Prime",Menlo,monospace}
.dvhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dvhead b{color:#8fe3a0;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem}.dvhead span{flex:1;min-width:0;color:#a7c4ad;font-size:.78rem}
.dvx{background:none;border:0;color:#a7c4ad;font-size:1rem;cursor:pointer}
.dvsec{display:grid;gap:6px}.dvsec h4{margin:0;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#6cc47a}
.dvrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dvb{font:inherit;font-size:.78rem;background:#1f2a21;color:#e3f3e6;border:1px solid #35503b;border-radius:6px;padding:.35em .6em;cursor:pointer}
.dvb:hover{border-color:#8fe3a0}.dvb.on{background:#2f5a38;border-color:#8fe3a0}.dvb.hot{background:#6cc47a;color:#0c140e;border-color:#6cc47a;font-weight:800}
.dvchk{display:flex;gap:6px;align-items:center;color:#a7c4ad;font-size:.78rem}
#dev select{font:inherit;font-size:.78rem;background:#1f2a21;color:#e3f3e6;border:1px solid #35503b;border-radius:6px;padding:.25em}
.dvnote{color:#7f9a85;font-size:.72rem;margin:0}

/* ===================== Night Ink skin ===================== */
body{font-size:15px;font-weight:500;background:var(--bg);min-height:100vh}
h1,h2,h3,.evtitle{letter-spacing:.02em;font-weight:400;text-transform:uppercase}
.eyebrow{font-family:var(--f-body);font-weight:800;letter-spacing:.12em}
/* panels: ink-black boxes with a hard comic drop shadow, flat, no gradients */
.top,.vs,.insp,.endcard,.shopwrap,.lvpick,.kpi,.ccard,.steps>div,#sheet .sh{border-radius:3px;border:2px solid var(--inkline);background:var(--panel);box-shadow:4px 4px 0 var(--inkline)}
.top{background:var(--panel);padding:10px 12px}
.res span{font-family:var(--f-display);font-size:1.3rem;letter-spacing:.02em}
.strip i{border-radius:2px;background:var(--panel2)}
.strip i.now{background:var(--gold);box-shadow:0 0 0 2px var(--inkline)}
/* buttons: flat fill, black outline, hard shadow, press down */
.btn{border-radius:3px;border:2px solid var(--inkline);background:var(--panel2);box-shadow:3px 3px 0 var(--inkline);text-transform:uppercase;letter-spacing:.04em;transition:transform .05s,box-shadow .05s}
.btn:hover:not(:disabled){border-color:var(--inkline);background:#3a3940}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--inkline)}
.btn.primary{background:var(--gold);color:#141012;border-color:var(--inkline)}
.btn.primary:hover:not(:disabled){background:#ffd84f}
.btn.big{font-family:var(--f-display);font-size:1.35rem;letter-spacing:.04em}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.lvn{border-radius:3px;border:2px solid var(--inkline);background:var(--panel2);font-family:var(--f-display);letter-spacing:.04em}
.lvn.on{background:var(--gold);color:#141012}
.title-word{font-size:clamp(3.4rem,15vw,6.2rem);color:var(--gold);letter-spacing:.02em;text-transform:uppercase;text-shadow:4px 4px 0 var(--inkline)}
/* the board and the battlefield: crisp square tiles with ink outlines */
.board,.field{border-radius:3px;border:2px solid var(--inkline);box-shadow:4px 4px 0 var(--inkline);
  background:#18171b}
.slot,.unit{border-radius:2px;border:2px solid var(--inkline);background:var(--panel2);box-shadow:3px 3px 0 var(--inkline)}
.slot:not(.empty){border-color:var(--inkline);border-top:4px solid var(--gc)}
.slot.tier3,.slot.tier4,.slot.tier5{border-top:4px solid var(--tc)}
.slot.empty{background:rgba(0,0,0,.25);border:2px dashed rgba(243,238,228,.16);box-shadow:none}
.slot .pt,.unit .pt{border:2px solid var(--inkline);box-shadow:0 0 0 2px var(--gc)}
.slot .nm{font-size:.74rem;font-weight:700}
.slot.sel{box-shadow:0 0 0 3px var(--gold),3px 3px 0 var(--inkline);border-color:var(--inkline)}

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const SET_KEY='tropebrawl-settings';

applyMotion();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ================= data =================
const TITLE='Tropebrawl';
const LV=[1,1.8,3.2];            // single heroes: stat and skill power by level
const TIERM=[1,1.5,2.1,3.2,6.0];    // rarity power, Common..Mythic: a 1-star Mythic is about a 3-star Rare
const PRICE=[1,2,3,4,7];
const RARITY=['Common','Uncommon','Rare','Epic','Mythic'];

// shop rank N unlocks rarity N; odds are Common..Mythic per rank

const RANK={odds:[[100,0,0,0,0],[75,25,0,0,0],[55,35,10,0,0],[40,35,22,3,0],[28,32,28,12,0],[18,28,34,20,0],[10,22,37.25,30,0.75]],xp:[4,8,12,16,20,24],train:4,trainXp:4,freeXp:1,board:[3,4,4,4,5,6,6],lv2:[0,0,0,0,0,0,0]};
const RMAX=RANK.odds.length;
// the rarest rarity a shop rank can show
function topTier(r){const o=RANK.odds[Math.max(0,Math.min(RMAX,r)-1)];let t=1;o.forEach((p,i)=>{if(p>0)t=i+1;});return t;}

// rarity identity: Commons and Uncommons stop at ★★; Rare, Epic and Mythic count as 2 for their genre from ★★ (v19.3)
function maxLv(id){return HERO[id].tier>=3||legend('spinoff')?3:2;}
function genreWeight(id,units){const rare=HERO[id].tier>=3;if(!rare&&!legend('spinoff'))return 1;const lv=Math.max(0,...(units||[]).filter(u=>u.id===id).map(u=>u.level||1));return lv>=(rare?2:3)?2:1;}

function sprImg(id){return SPRITES[id]?`<img class="spr" src="${SPRITES[id]}" alt="" draggable="false">`:'';}
// group characters: the art is ONE member, drawn once per body (at most 3; the xN badge shows the real count) in a staggered formation
function formation(n){const f=Math.ceil(n/2),b=n-f,span=n<=3?26:n<=5?36:44,row=(c,y,sc,off)=>Array.from({length:c},(_,i)=>({x:c<2?off:-span+2*span*i/(c-1)+off,y,sc}));
  return [...row(b,12,.88,0),...row(f,0,.98,0)];}
// optional variants <id>_2, <id>_3 ... are mixed in so a squad isn't identical copies
function crowdArt(id){const v=[SPRITES[id]];for(let k=2;SPRITES[id+'_'+k];k++)v.push(SPRITES[id+'_'+k]);return v;}
function crowdImgs(id,n){const v=crowdArt(id);return formation(Math.max(0,n)).map((p,k)=>`<img src="${v[(k*2+1)%v.length]}" alt="" draggable="false" style="--x:${p.x.toFixed(1)}px;--y:${p.y}px;--h:${p.sc};--m:${k%2?-1:1}">`).join('');}
function crowdSpr(id,n){n=Math.min(3,n);return `<div class="crowdspr" data-n="${n}">${crowdImgs(id,n)}</div>`;}

  if(S&&k==='promotion'){const u=promoTarget();return u?`Your lowest-level character on the board levels up: <b>${esc(HERO[u.id].name)}</b> ${'★'.repeat(u.level)} → ${'★'.repeat(u.level+1)}.`:'Nobody on the board can level up (Epics and Mythics can\'t): +🪙5 instead.';}
  if(S&&k==='casting'){const c=castTarget();return c?`<b>${esc(HERO[c.u.id].name)}</b> (${RARITY[HERO[c.u.id].tier-1]} ${'★'.repeat(c.u.level)}) is recast as a random ${GENRES[HERO[c.u.id].genre].name} ${RARITY[c.to-1]}, keeping its stars.`:'Nobody on the board to recast: +🪙5 instead.';}
  if(S&&k==='wheel'){const own=WHEEL.filter(t=>S.units.some(u=>HERO[u.id].tier===t)).map(t=>`${RARITY[t-1]} ×${S.units.filter(u=>HERO[u.id].tier===t).length}`);return EVENTS[k].d+(own.length?` You own: ${own.join(' · ')}.`:'');}
  return EVENTS[k].d;
}

// ================= game levels (difficulty ladder) =================
// Game Level N plays with the rules of levels 1..N, stacked. Winning Level N unlocks Level N+1.
// Unlocks live in their own localStorage key, so runs and saves are untouched.
const pctOf=k=>Math.round(100*k)+'%';
const LEVELS=[
  {id:'limited',e:'📉',name:'Limited Run',d:()=>`Every character pool holds ${TUNE.poolCut} fewer copies, so ★★★ characters are harder to finish.`},
  {id:'plot',e:'🎲',name:'Plot Twists',d:()=>'Every event swaps one choice for a risky one: Trial by Fire, Casting Call or Traveling Merchant.'},
  {id:'xp1',e:'🐢',name:'Slow Promotions',d:()=>`Shop ranks need ${pctOf(TUNE.lvXp[0])} more XP.`},
  {id:'elite',e:'🌟',name:'Guest Stars',d:()=>`The fight before each boss is a mini-boss: enemies get +${pctOf(TUNE.lvElite-1)} HP and damage, and a win pays 🪙${TUNE.lvEliteGold}.`},
  {id:'life1',e:'💔',name:'Short Season',d:()=>'You start with 9 lives.'},
  {id:'twin',e:'😈',name:'Evil Twin',d:()=>`Bosses bring an evil twin of your strongest character, with +${pctOf(TUNE.lvTwin-1)} HP and damage but no skill.`},
  {id:'extras',e:'👥',name:'Crowd Scenes',d:()=>'From Act 2, normal fights bring an extra crowd of Nameless Mooks.'},
  {id:'xp2',e:'🐌',name:'Slower Promotions',d:()=>`Shop ranks need ${pctOf(TUNE.lvXp[0]+TUNE.lvXp[1])} more XP in total.`},
  {id:'life2',e:'💔',name:'Shorter Season',d:()=>'You start with 8 lives.'},
  {id:'finale2',e:'🎞️',name:'Two-Part Finale',d:()=>'After Deus Ex Machina, the first two bosses return together.'},
];
const LV_MAX=LEVELS.length,LV_KEY='tropebrawl-levels';
function rulesFor(n){return LEVELS.slice(0,Math.max(0,Math.min(LV_MAX,n|0))).map(r=>r.id);}
function rule(id){return !!S&&!!S.rules&&S.rules.includes(id);}
function lvLine(r){return `${r.e} <b>${esc(r.name)}:</b> ${esc(r.d())}`;}
function maxLives(){return (S&&S.maxLives)||10;}
// Tougher Reviews: from Game Level lvFoeFrom on, enemies get +lvFoe HP and damage per level
function foeStep(n){return Math.max(0,(n|0)-TUNE.lvFoeFrom+1)*TUNE.lvFoe;}
function foeMul(){return 1+foeStep(S&&S.lv);}
// shop XP per rank goes up with Slow / Slower Promotions
function xpMul(){return 1+(rule('xp1')?TUNE.lvXp[0]:0)+(rule('xp2')?TUNE.lvXp[1]:0);}
function xpFor(i){return Math.round(RANK.xp[i]*xpMul());}
// the dials at level n in one line: rounds, lives, shop XP, bosses
function lvRounds(n){const R=rulesFor(n);return 7*TUNE.acts+(R.includes('finale2')?1:0);}
function lvDials(n){const R=rulesFor(n),h=id=>R.includes(id);
  const rounds=lvRounds(n),lives=10-(h('life1')?1:0)-(h('life2')?1:0),xp=(h('xp1')?TUNE.lvXp[0]:0)+(h('xp2')?TUNE.lvXp[1]:0);
  const bosses=TUNE.acts+(h('finale2')?1:0);
  return `${rounds} rounds · ${lives} lives · shop XP ${xp?'+'+pctOf(xp):'normal'} · ${bosses} bosses${h('elite')?' + 3 mini-bosses':''}${foeStep(n)?' · enemies +'+pctOf(foeStep(n)):''}`;}
function lvLoad(){let j={};try{j=JSON.parse(localStorage.getItem(LV_KEY)||'{}')||{};}catch(e){}
  const open=Math.max(0,Math.min(LV_MAX,j.open|0));
  if((DEV.on&&DEV.all)||SET.allLv)return {open:LV_MAX,won:Array.isArray(j.won)?j.won:[],pick:Math.max(0,Math.min(LV_MAX,j.pick|0)),dev:1};
  return {open,won:Array.isArray(j.won)?j.won.filter(n=>n>=0&&n<=open):[],pick:Math.max(0,Math.min(open,j.pick|0))};}
function lvStore(p){if(p.dev){try{const j=JSON.parse(localStorage.getItem(LV_KEY)||'{}')||{};j.pick=p.pick;localStorage.setItem(LV_KEY,JSON.stringify(j));}catch(e){}return;}try{localStorage.setItem(LV_KEY,JSON.stringify(p));}catch(e){}}
// called once when a run ends (from the result screen): a win unlocks the next level and selects it
function lvRecord(){
  if(!S||!S.over||S.recorded)return;S.recorded=true;tlEnd(false);
  const p=lvLoad(),n=S.lv|0;
  if(S.result==='win'){if(!p.won.includes(n))p.won.push(n);if(n>=p.open&&n<LV_MAX){p.open=n+1;p.pick=n+1;S.newLv=n+1;UI.lv=n+1;}}
  lvStore(p);
}

function bodiesFromP(p){return Math.max(3,Math.round(p*3));}

// ================= run state =================
let S=null;
let UI={screen:'title',sel:null,speed:1,sheetOpen:false,armSell:null,armQuit:false,lv:0};
let B=null;
const SAVE_KEY='tropebrawl-lean-v5', OLD_SAVE_KEY='tropebrawl-lean-v4'; // v5: items have levels (S.tlv); v4 saves are upgraded on load

// item level 0-3 (0 = not held); has()/tv() feed the battle, so TUNE.noItems switches every item off for tests
function ilv(t){return S&&S.trinkets.includes(t)?((S.tlv&&S.tlv[t])||1):0;}
function lvl(t){return TUNE.noItems?0:ilv(t);}
function has(t){return lvl(t)>0;}
function tv(t){const L=lvl(t);return L?parseFloat(TR[t].v[L-1]):0;}
function itemSellValue(t){return 1+ilv(t);}
// run statistics for the end screen (older saves get the missing fields on first use)
function runStats(){const s=S.stats;s.dmg=s.dmg||{};s.taken=s.taken||{};s.spend=s.spend||{buy:0,reroll:0,rank:0};s.rerolls=s.rerolls||0;s.rounds=s.rounds||[];s.sold=s.sold||0;return s;}
function legend(id){return !!S&&S.legend===id;}
function boardSize(){return RANK.board[S.rank-1];}
const fieldSlots=['f0','f1','f2','b0','b1','b2'];
const benchSlots=['n0','n1','n2','n3','n4'];
function unitAt(slot){return S.units.find(u=>u.slot===slot);}
function fielded(){return S.units.filter(u=>u.slot[0]!=='n');}
function benched(){return S.units.filter(u=>u.slot[0]==='n');}
function highestOf(id){return S.units.filter(u=>u.id===id).sort((a,b)=>b.level-a.level)[0];}
function maxedIds(){return new Set(S.units.filter(u=>u.level>=maxLv(u.id)).map(u=>u.id));}
function sellValue(u){const half=Math.floor(PRICE[HERO[u.id].tier-1]*COPIES[u.level-1]/2); // half of the list price, rounded down
  // Buyback Wheel: characters you owned when the wheel stopped on their rarity sell back for what you paid for them
  // then, for the rest of the run (free ones: half as usual). The refund is locked at the spin, so nothing bought later
  // counts and no refund can exceed what you spent.
  if(!buybackOn(u))return half;const full=S.fullSell[u.uid]|0;
  return Math.max(half,full+Math.floor(Math.max(0,(u.cost|0)-full)/2));}
function buybackOn(u){return !!(S.fullSell&&S.fullSell[u.uid]!=null);}
function curRound(){return SCHEDULE[S.round-1];}

setInterval(()=>{if(typeof S!=='undefined'&&S&&!S.over&&typeof document!=='undefined'&&document.visibilityState==='visible')S.playMs=(S.playMs||0)+1000;},1000);
function newRun(){if(typeof UI!=='undefined'){UI._g=UI._l=null;UI._bk=null;}
  const lv=Math.max(0,Math.min(LV_MAX,UI.lv|0));
  S={lv,rules:rulesFor(lv),part:1,round:1,lives:10,gold:6,streak:0,rank:1,xp:0,wins:0,units:[],trinkets:[],tlv:{},legend:null,shop:[],locked:false,uid:1,paid:{},pending:[],freeRerolls:0,
     bossTries:0,lastWin:null,stats:{fights:0,won:0,merges:0,gold:0,lost:0},over:false,enemy:null,event:null};
  S.maxLives=10-(rule('life1')?1:0)-(rule('life2')?1:0);S.lives=S.maxLives;
  buildSchedule(rule('cut'));
  rollSpecials();
  rollShop();
  startRound();
}
// ---- shop ----
function shopOdds(){return RANK.odds[S.rank-1];}
function rollTier(){const o=shopOdds();let r=rand()*100;for(let i=0;i<o.length;i++){if(r<o[i])return i+1;r-=o[i];}return 1;}
// character pools: a fixed number of copies per character (by rarity); buying takes copies out, selling puts them back
function poolMax(id){return TUNE.poolSize[HERO[id].tier-1]-(rule('limited')?TUNE.poolCut:0);}
function poolLeft(id){return S.pool&&S.pool[id]!=null?S.pool[id]:poolMax(id);}
function poolTake(id,n){S.pool=S.pool||{};S.pool[id]=Math.max(0,poolLeft(id)-n);}
function poolGive(id,n){S.pool=S.pool||{};S.pool[id]=Math.min(poolMax(id),poolLeft(id)+n);}
function poolOpen(id){const shown=(S.shop||[]).filter(o=>o&&o.id===id).reduce((t,o)=>t+COPIES[o.level-1],0);return poolLeft(id)-shown>0;}
function heroOf(rar){const maxed=maxedIds();const pool=HEROES.filter(h=>h[4]===rar&&!maxed.has(h[0])&&!(S.cut||[]).includes(h[2])).map(h=>h[0]);return pool.length?pick(pool):null;}
function rollShop(){
  if(typeof UI!=='undefined'){UI.pick=null;UI.deal=1;} // a new shop: no card stays half-selected
  const maxed=maxedIds();
  S.shop=[];let nudged=0;
  for(let i=0;i<SHOP_SLOTS;i++){
    const tier=rollTier();
    let pool=HEROES.filter(h=>h[4]===tier&&!maxed.has(h[0])&&!(S.cut||[]).includes(h[2])&&poolOpen(h[0])).map(h=>h[0]);
    // gentle nudge toward heroes you already own, so merges stay reachable as the roster grows
    const mine=pool.filter(id=>S.units.some(u=>u.id===id));
    if(mine.length&&rand()<TUNE.ownBias&&nudged<TUNE.ownCap){pool=mine;nudged++;}
    if(!pool.length)pool=HEROES.filter(h=>!maxed.has(h[0])&&!(S.cut||[]).includes(h[2])&&poolOpen(h[0])).map(h=>h[0]);
    if(!pool.length){S.shop.push(null);continue;}
    const id=pick(pool);
    // ready-made ★★: rare in a normal shop (RANK.lv2), common with the Talent Scout Legendary (any rarity)
    S.shop.push({id,level:(legend('scout')?rand()<TUNE.scoutChance:HERO[id].tier<=2&&rand()<RANK.lv2[S.rank-1])?2:1});
  }
  S.seen=S.seen||{};S.shop.forEach(o=>{if(o&&!S.seen[o.id]){o.nw=1;S.seen[o.id]=1;}});
}
function shopPrice(o){const p=PRICE[HERO[o.id].tier-1];return o.level===2?Math.round(p*(legend('scout')?TUNE.scoutMult:3)):p;}
function canBuy(i){
  const o=S.shop[i];if(!o)return {ok:false,why:'Sold'};
  if(S.gold<shopPrice(o))return {ok:false,why:'Not enough gold'};
  if(o.level===2){const hi=highestOf(o.id);if(hi&&hi.level>=maxLv(o.id))return {ok:false,why:'Already max'};if(hi)return {ok:true};}
  if(freeSlotFor()!==null)return {ok:true};
  const l1=S.units.filter(u=>u.id===o.id&&u.level===1).length;
  if(o.level===1&&l1>=2)return {ok:true};
  return {ok:false,why:'Bench full'};
}
function freeSlotFor(id){
  const room=id&&fielded().length<boardSize();
  const dupe=id&&fielded().some(u=>u.id===id);
  const melee=id&&TBASE[HERO[id].trait].range==='melee'&&HERO[id].genre!=='ball'&&HERO[id].trait!=='stalker';
  if(room&&!dupe){const order=melee?['f1','f0','f2','b1','b0','b2']:['b1','b0','b2','f1','f0','f2'];for(const s of order)if(!unitAt(s))return s;}
  for(const s of benchSlots)if(!unitAt(s))return s;
  if(room)for(const s of ['f1','f0','f2','b1','b0','b2'])if(!unitAt(s))return s;
  if(!id)for(const s of fieldSlots)if(!unitAt(s)&&fielded().length<boardSize())return s;
  return null;
}
function buy(i){
  const c=canBuy(i);if(!c.ok){toast(c.why);return false;}
  const o=S.shop[i];const pr=shopPrice(o);tlAct('b',o.id+':'+o.level);S.gold-=pr;runStats().spend.buy+=pr;S.shop[i]=null;poolTake(o.id,COPIES[o.level-1]);
  if(o.level===2&&highestOf(o.id)){const h=highestOf(o.id);h.cost=(h.cost||0)+pr;levelUp(h);}
  else{if(o.level===2){S.paid[o.id]=S.paid[o.id]||{};S.paid[o.id][2]=true;}S.units.push({uid:S.uid++,id:o.id,level:o.level,slot:freeSlotFor(o.id)||'tmp',cost:pr});if(typeof UI!=='undefined')UI.pop=S.uid-1;}
  checkMerges();
  S.units.forEach(u=>{if(u.slot==='tmp'){const s=freeSlotFor(u.id);if(s)u.slot=s;else{S.gold+=sellValue(u);poolGive(u.id,COPIES[u.level-1]);u.slot='gone';}}});
  S.units=S.units.filter(u=>u.slot!=='gone');
  return true;
}
function rerollCost(){return legend('dircut')?1:TUNE.reroll;}
function reroll(){
  if(S.freeRerolls>0)S.freeRerolls--;
  else{const c=rerollCost();if(S.gold<c){toast('Not enough gold');return false;}S.gold-=c;runStats().spend.reroll+=c;S.rrRound=(S.rrRound||0)+1;}
  tlAct('r');runStats().rerolls++;rollShop();S.locked=false;return true;
}
function xpNeed(){return S.rank>=RMAX?null:xpFor(S.rank-1);}
function trainCost(){return S.rank>=RMAX?null:RANK.train;}
// add shop XP: each full gauge is a rank (extra XP carries over). quiet: no preview card (the caller rolls a fresh shop)
function gainXp(n,quiet){
  S.xp=(S.xp||0)+n;let up=0;
  while(S.rank<RMAX&&S.xp>=xpNeed()){S.xp-=xpNeed();S.rank++;up++;if(!legend('skeleton'))autoFill();}
  if(S.rank>=RMAX)S.xp=0;
  return up;
}
function train(){const c=trainCost();if(c==null||S.gold<c)return false;tlAct('t');S.gold-=c;runStats().spend.rank+=c;gainXp(RANK.trainXp);return true;}
// older names, kept so the headless bots still run: one call is one Train
const rankCost=trainCost,rankUp=train;
function rankMsg(b0){const t=topTier(S.rank),nt=t>topTier(S.rank-1);return `⬆️ Rank ${S.rank}${nt?`: ${RARITY[t-1]}s can now appear`+(t===5?` (${RANK.odds[RMAX-1][4]}% per card)`:''):': better odds'}${boardSize()>b0?` · ${boardSize()} board slots`:''}`;}
function rankPreview(){
  // preview: a hero of the newly unlocked rarity shows up right away
  if(false){const id=null;if(id){
    // replace an empty slot, else a card that doesn't help a merge
    let i=S.shop.findIndex(o=>!o);
    if(i<0)i=S.shop.findIndex(o=>o.level===1&&!o.preview&&!S.units.some(u=>u.id===o.id));
    if(i<0)i=S.shop.findIndex(o=>!o.preview&&!S.units.some(u=>u.id===o.id));
    if(i<0)i=S.shop.length-1;
    S.shop[i]={id,level:1,preview:true};UI.freshSlot=i;}}
}
function nextSlotRank(){for(let r=S.rank+1;r<=RMAX;r++)if(RANK.board[r-1]>boardSize())return r;return null;}
function sell(uid){const u=S.units.find(x=>x.uid===uid);if(!u)return false;tlAct('s',u.id+':'+u.level);poolGive(u.id,COPIES[u.level-1]);runStats().sold+=sellValue(u);S.gold+=sellValue(u);S.units=S.units.filter(x=>x!==u);if(UI.sel===u.slot)UI.sel=null;return true;}
function move(from,to){
  const a=unitAt(from),b=unitAt(to);if(!a||from===to)return false;
  const toField=to[0]!=='n',fromField=from[0]!=='n';
  if(toField&&!fromField&&!b&&fielded().length>=boardSize()){const nr=nextSlotRank();toast(`Board full (${boardSize()}).${nr?` Rank ${nr} adds a slot.`:''}`);return false;}
  a.slot=to;if(b)b.slot=from;return true;
}
function autoFill(){for(const u of benched()){if(fielded().length>=boardSize())break;const s=freeSlotFor(u.id);if(s&&s[0]!=='n')u.slot=s;}}
// ---- merging ----
function noteLevel(id,level){S.paid[id]=S.paid[id]||{};if(!S.paid[id][level]){S.paid[id][level]=true;if(HERO[id].tier>=3)S.pending.push({kind:'merge',id,level});}}
function levelUp(u){if(u.level>=maxLv(u.id))return;u.level++;S.stats.merges++;noteLevel(u.id,u.level);toast(`${HERO[u.id].e} ${HERO[u.id].name} ${'★'.repeat(u.level)}!${u.level===maxLv(u.id)?' Max level: it leaves the shop.':''}`);}
function checkMerges(){
  let changed=true,guard=0;
  while(changed&&guard++<20){
    changed=false;
    for(const lvl of [1,2]){
      for(const id of [...new Set(S.units.map(u=>u.id))]){
        if(lvl>=maxLv(id))continue;
        const same=S.units.filter(u=>u.id===id&&u.level===lvl);
        const need=lvl===1?3:2;
        if(same.length>=need){
          const parts=same.slice(0,need);
          parts.sort((a,b)=>(a.slot[0]==='n'||a.slot==='tmp')-(b.slot[0]==='n'||b.slot==='tmp'));
          const keep=parts[0];keep.cost=parts.reduce((t,p)=>t+(p.cost||0),0);
          if(S.fullSell&&parts.some(p=>S.fullSell[p.uid]!=null)){const fs=parts.reduce((t,p)=>t+(S.fullSell[p.uid]|0),0);parts.forEach(p=>delete S.fullSell[p.uid]);S.fullSell[keep.uid]=fs;}
          parts.slice(1).forEach(p=>{S.units=S.units.filter(x=>x!==p);});
          if(keep.slot==='tmp')keep.slot=freeSlotFor(keep.id)||'tmp';
          levelUp(keep);changed=true;if(typeof UI!=='undefined')UI.merged=keep.uid;
        }
      }
    }
  }
}
// offers skip items that can't help right now: Ledger at Rank 5, Scope with no ranged, Banner with no melee on the board
function itemUseful(t){
  if(t==='scope'||t==='banner'){const f=fielded();const r=t==='scope'?'ranged':'melee';return !f.length||f.some(u=>TBASE[HERO[u.id].trait].range===r);}
  return true;
}
// 3 offers: one levels up an item you hold (if any is below ★★★), the others are new items
// (rare = the boss's bonus Rare item: a new item when there is one)
function trinketChoices(level,rare){
  const up=S.trinkets.filter(t=>ilv(t)<ITEM_MAX&&itemUseful(t));
  const pool=TRINKETS.map(a=>a[0]).filter(t=>!S.trinkets.includes(t)&&itemUseful(t));
  const wR=rare?0.75:level>=3?0.6:0.2;const out=[];
  if(up.length&&!rare)out.push(pick(up));
  while(out.length<3){
    const want=rand()<wR?'R':'C';
    let p=pool.filter(t=>TR[t].rar===want&&!out.includes(t));
    if(!p.length)p=pool.filter(t=>!out.includes(t));
    if(!p.length)p=up.filter(t=>!out.includes(t));
    if(!p.length)break;out.push(pick(p));
  }
  return shuffle(out);
}
// v = an item id, or "new>old" when 5 items are held: old is sold and the new item takes its place at ★
// a copy of an item you hold combines into it and levels it up (max ★★★); nothing valid pays 3 gold
function takeTrinket(v){
  const [id,old]=(v||'').split('>');
  if(!TR[id]){S.gold+=3;return;}
  S.tlv=S.tlv||{};
  if(S.trinkets.includes(id)){if(ilv(id)<ITEM_MAX)S.tlv[id]=ilv(id)+1;else S.gold+=3;return;}
  if(S.trinkets.length<TRINKET_CAP){S.trinkets.push(id);S.tlv[id]=1;return;}
  const i=S.trinkets.indexOf(old);if(i<0){S.gold+=3;return;}
  sellItem(old);S.trinkets.splice(i,0,id);S.tlv[id]=1;
}
function itemMsg(v){const [id,old]=(v||'').split('>');if(!TR[id])return '+3 gold.';const L=ilv(id);
  if(L)return L<ITEM_MAX?`${TR[id].name} levels up to ${'★'.repeat(L+1)}.`:'+3 gold.';
  if(S.trinkets.length>=TRINKET_CAP&&TR[old])return `${TR[id].name} replaces ${TR[old].name} (sold for 🪙${itemSellValue(old)}).`;
  return `You take the ${TR[id].name}.`;}
// sell an item between fights: 🪙2 / 3 / 4 by level, frees a slot
function sellItem(id){if(!S.trinkets.includes(id))return false;const g=itemSellValue(id);S.gold+=g;runStats().sold+=g;S.trinkets=S.trinkets.filter(t=>t!==id);delete S.tlv[id];return true;}
function genreCounts(units){const g={};[...new Set(units.map(u=>u.id))].forEach(id=>{const k=HERO[id].genre;g[k]=(g[k]||0)+genreWeight(id,units);});return g;}
function legendChoices(n){n=n||2;
  const g=genreCounts(fielded());
  const ranked=Object.keys(g).filter(k=>g[k]>=2).sort((a,b)=>g[b]-g[a]);

function lossTip(){

function settle(){

  S.stats.fights++;
  const A=B.units.filter(u=>u.side==='A'&&!u.summon);
  const rs=runStats();const seen=new Set();
  rs.heal=rs.heal||{};rs.block=rs.block||{};
  A.forEach(u=>{if(u.healDone)rs.heal[u.id]=(rs.heal[u.id]||0)+u.healDone;if(u.blocked)rs.block[u.id]=(rs.block[u.id]||0)+u.blocked;});
  A.forEach(u=>{const e=rs.dmg[u.id]||(rs.dmg[u.id]={d:0,f:0,best:0});e.d+=u.dmgDone;e.best=Math.max(e.best,u.dmgDone);if(!seen.has(u.id)){seen.add(u.id);e.f++;}});
  Object.entries(B.threat).forEach(([k,v])=>{rs.taken[k]=(rs.taken[k]||0)+v;});
  const env=Object.assign({},B.env||{});const sd=B.units.filter(u=>u.side==='A'&&u.summon).reduce((a,u)=>a+u.dmgDone,0);if(sd)env.summons=sd;
  Object.entries(env).forEach(([k,v])=>{const e=rs.dmg['@'+k]||(rs.dmg['@'+k]={d:0,f:0,best:0});e.d+=v;e.f++;e.best=Math.max(e.best,v);});
  const mvp=A.slice().sort((a,b)=>b.dmgDone-a.dmgDone)[0];res.mvp=mvp?{e:mvp.e,name:mvp.name,dmg:R(mvp.dmgDone)}:null;

  let g=B.goldEarned+(G.fin?(G.fin>=2?4:2):0);
  const sk=win?Math.max(0,S.streak||0)+1:Math.min(0,S.streak||0)-1;S.streak=sk;res.streak=sk;res.sgold=streakGold(sk);g+=res.sgold;S.stats.streak=(S.stats.streak||0)+res.sgold;

  rs.rounds.push({r:S.round,t:res.boss?'boss':'fight',w:win});
  if(X.draft)S.freeRerolls+=1;
  res.rerolls=(win?0:1)+(X.draft?1:0);
  S.gold+=g;S.stats.gold+=g;res.gold=g;
  if(res.boss&&ev.act<TUNE.acts&&S.lives>0)S.pending.push({kind:'legend',win});
  // Guest Stars / Trial by Fire: a win pays an item pick
  if(win&&S.enemy&&S.enemy.trial&&S.lives>0)S.pending.push({kind:'trial',level:3});

const CODEX_TABS=[['how','How it works'],['heroes','Characters'],['syn','Genres & traits'],['cross','Crossovers'],['trinkets','Items'],['legends','Legendaries'],['enemies','Enemies']];
SCR.codex=()=>{
  const tab=UI.codexTab||'how';
  let body='';
  if(tab==='how')body=`<div class="rules">
    <p><b>Each round</b> you get gold, shop, set up your board, then fight. A run is 28 rounds in 4 acts of 7: fight, fight, event, three more fights, boss. You start with 10 ❤️; a loss costs 2–3 depending on the act (+1 for a boss). Beat the final boss to win.</p>
    <p><b>Shop.</b> 🔄 rerolls for 🪙2 and 🔓 locks the shop for next round.</p>
    <p><b>Gold.</b> Every round pays 🪙5. <b>Interest:</b> 🪙1 for every 🪙10 you hold when the round ends, up to 🪙5 at 🪙50, so saving pays, but gold in the bank doesn't fight. <b>Streaks:</b> 2 or 3 fights in a row pay +1, 4 pay +2, 5 or more pay +3, for wins and for losses. A win pays +1 and a loss +1 and a free reroll. A good rhythm: bank early in each act and spend before the boss.</p>
    <p><b>Rarity and shop rank.</b> Characters are <span class="tier1" style="color:var(--tc)">Common</span>, <span class="tier2" style="color:var(--tc)">Uncommon</span>, <span class="tier3" style="color:var(--tc)">Rare</span>, <span class="tier4" style="color:var(--tc)">Epic</span> or <span class="tier5" style="color:var(--tc)">Mythic</span> (🪙${PRICE[0]}–${PRICE[PRICE.length-1]}). ⬆️ Train the shop (🪙${RANK.train} for ${RANK.trainXp} XP; it also gets ${RANK.freeXp} XP free every round). Each full gauge is a rank: ${[2,3,4,5,6,7].filter(r=>r<=RMAX&&topTier(r)>topTier(r-1)).map(r=>'Rank '+r+' unlocks '+RARITY[topTier(r)-1]).join(', ')}, and every rank improves the odds. Ranks ${(a=>a.slice(0,-1).join(', ')+' and '+a[a.length-1])([2,3,4,5,6,7].filter(r=>r<=RMAX&&RANK.board[r-1]>RANK.board[r-2]))} add a board slot. Mythics only show up at Rank ${RANK.odds.findIndex(o=>o[4]>0)+1}, and rarely. <button class="btn sm" data-a="rank-info">See the odds</button></p>
    <p><b>Leveling up.</b> 3 copies of a character combine into ★★; two ★★ combine into ★★★. Commons and Uncommons stop at ★★ (the Spin-off Deal Legendary lifts that). Maxed characters stop appearing in the shop. With the Talent Scout Legendary, the shop also offers ready-made ★★ cards; buying one levels up your best copy. The first time a Rare, Epic or Mythic character reaches ★★ or ★★★ you pick an item for your whole team (hold up to 5; pick one you have again to level it up, or sell one to free a slot).</p>
    <p><b>Board.</b> The top row is your front row; it gets hit first. Benched characters don't fight.</p>
    <p><b>Who attacks whom.</b> Taunting enemies are always hit first. Otherwise melee characters hit the nearest front-row enemy, ranged characters shoot the lowest-HP enemy anywhere, and Stalkers leap at the weakest back-row enemy. A melee character in your back row waits behind its own lane (the front square in its column) and <b>steps up</b> into it as soon as it is empty: at the start of the fight or the moment the front-liner falls. It steps up before your bench fills the gap, and charges its ability a little while it waits (Stalkers and Sportsball characters don't wait). When a side's whole front row is wiped out, its back row steps forward. New characters you buy go where they fight best: melee to an empty front square, everyone else to the back.</p>
    <p><b>Energy and skills.</b> Characters gain energy by attacking and getting hit. A full blue bar casts their skill.</p>
    <p><b>Genres &amp; traits.</b> Different characters on your board that share a Genre switch on bonuses at 2, 4 and 6; a Trait at 2 and 4. Two genres with 2 characters each switch on a Crossover. Rare, Epic and Mythic characters count as 2 for their genre from ★★, so a wide board of two or three genres fills up fast.</p>
    <p><b>Crowds</b> (👥) are one card holding several bodies. They hit harder with more bodies left, and area attacks deal them double damage.</p>
    <p><b>Legendaries.</b> After the Act 1, 2 and 3 bosses you choose a Legendary, win or lose: 3 to choose from and a bonus item if you won, 2 if you lost. You hold one at a time.</p>
    <p><b>Targeting.</b> Every character shows its rule: ↕️ Lane (the front-liner straight across first), 🎯 Sharpshooter (Gunners: the lowest-HP enemy anywhere) or 🗡️ Backline (Stalkers: the weakest back-liner). Taunts override all of them. Some characters move mid-fight: the Field Medic hops around the board, swapping places with whoever is hurt worst (front or back), and the Burrow Lurker tunnels into the enemy back row.</p>
    <p><b>The Cut.</b> A bad random event: the studio goes after your biggest genre and it leaves the shop for the rest of the run. Pay gold to keep your characters of that genre, let them go (sold for half), or fight it with lives.</p>
    <p><b>Events.</b> The 3rd round of each act is an event round: pick 1 of 3 (❓ on the round track). On top of that, each act can bring one <b>random event</b>, somewhere between its first fight and its boss (rounds 2-6 of each act). You never know exactly when: it pops up at the start of a round, before the shop. Random events are good (Crossover Cameo, Fan Mail, Craft Services), bad, where you pick your loss (Writers' Strike, Bad Review, Stolen Props), or trade-offs (The Cut, Buyback Wheel, Training Montage, Cursed Script, Stunt Insurance, Reboot). Each can happen once per run. Higher Game Levels bring more of them, and more bad ones: a window fires 40% of the time at Level 0, plus 6% per level.</p>
    <p><b>Buyback Wheel.</b> A random event: spin for Uncommon, Rare or Epic. Spin for Common, Uncommon, Rare or Epic (never Mythic); a rarity you own none of is a Dud. A thin gold ALL sliver (6%) covers every rarity but Mythic. If it hits, the characters of that rarity you own at that moment sell back for what you paid, for the rest of the run. Characters bought later and free ones still sell for half.</p>
    <p><b>Selling</b> refunds half of what a character cost, rounded down.</p>
    <p><b>Battle bench.</b> Summons (skeletons, hatchlings) need an empty slot. If there is none, they wait on the battle bench as cards: spawns of the same kind stack on one card up to 20 bodies, and extra ones start a new card (up to 8 cards). When a slot opens, spawns left behind by the fallen character (Undead 6's skeletons) take it first; then a character waiting to rise (Bone Dragon) - characters always go before summons; then the oldest bench card steps in as one crowd.</p>
    <p><b>Positioning.</b> Lanes: characters attack the enemy front-liner in their own column first. Cover: a back-row character directly behind one of your Guardians takes 25% less damage. Neighbors: Medics heal the characters right beside them 50% more. Splash hits neighbors too.</p>
